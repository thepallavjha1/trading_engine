name: Trading Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install --break-system-packages -r requirements-engine.txt

      - name: Run trading cycle
        run: cd src && python3 run.py --once

      - name: Run report
        run: cd src && python3 report_generator.py

      - name: Commit and push
        run: |
          git config user.name  "trading-bot[bot]"
          git config user.email "trading-bot[bot]@users.noreply.github.com"
          git add data/trades.jsonl data/reflections.jsonl configs/strategy.yaml history/ reports/
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "chore: trading cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
