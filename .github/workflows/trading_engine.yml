name: Trading Engine

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading cycle
        run: |
          cd src
          python run.py --once

      - name: Run report
        run: |
          cd src
          python report_generator.py

      - name: Commit updated data
        run: |
          git config user.name  "trading-bot[bot]"
          git config user.email "trading-bot[bot]@users.noreply.github.com"
          git add \
            data/trades.jsonl \
            data/reflections.jsonl \
            configs/strategy.yaml \
            history/ \
            reports/
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "chore: trading cycle $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Push changes
        run: git push
